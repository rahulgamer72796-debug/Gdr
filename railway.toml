# ─────────────────────────────────────────────────────────────────────────────
#  Railway deployment config — https://docs.railway.com/reference/config-as-code
#
#  IMPORTANT (this is the file that fixes the build error):
#    Railway rejects `VOLUME` inside a Dockerfile, so the image declares none.
#    Persistence is provided by a **Railway Volume** instead — attach one in
#    the dashboard:
#
#        Service → Settings → Volumes → New Volume → Mount path: /app/data
#
#  Required environment variables (Service → Variables):
#        BOT_TOKEN, OWNER_ID, GDRIVE_CLIENT_ID, GDRIVE_CLIENT_SECRET
#
#  Optional: LOG_CHANNEL_ID, MAX_FILE_GB, MAX_CONCURRENT_TASKS, DOWNLOAD_DIR
# ─────────────────────────────────────────────────────────────────────────────

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# A Telegram bot has no HTTP port. Use a restart policy instead of health-checks
# so Railway does not wait forever for a port that never opens.
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
numReplicas = 1
